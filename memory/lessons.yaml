version: 1
confidence_scale:
  candidate_init: 0
  active_min: 1
  active_max: 10
  rejected_min: -5
  rejected_max: -1
review_policy:
  required_reviewers:
    - codex
    - claude
    - gemini
    - human
  activation_rule: Keep confidence at 0 until all required reviewers approve and a human explicitly promotes it.
  promotion_rule: Increase confidence only after future workflow usage shows the lesson prevented or detected a real issue, followed by codex, claude, gemini, and human review.
  rejection_rule: Use -1 to -5 when a candidate is unsupported, overgeneralized, harmful, or superseded.
lessons:
  - id: verify-train-eval-action-image-processing-parity
    title: Verify action normalization parity between training and evaluation
    confidence: 1
    reason_category: implementation_correction
    trigger_event: >
      A workflow run showed that evaluation could complete while still producing
      invalid robot policy behavior because training normalized actions but
      checkpoints did not consistently provide action_mean and action_std to
      evaluation, and normalized action outputs could be passed to the
      environment instead of denormalized raw action targets. The workflow
      repaired this by saving action statistics during training, loading them
      during evaluation, keeping model rollout in normalized action space, and
      denormalizing before environment execution.
    claim: >
      For robot policy workflows that train or roll out models in normalized
      action space, evaluation must use the same saved action statistics and
      apply inverse normalization at the environment-execution boundary;
      otherwise evaluation can run cleanly while measuring action-contract drift
      rather than policy quality.
    applies_when:
      - Training normalizes actions, action deltas, joint targets, or control commands before model learning
      - Evaluation loads checkpoints and independently reconstructs action transforms or executes predicted actions in an environment
      - CEM, policy rollout, or world-model rollout operates in normalized action space but environment APIs expect raw action targets
      - Robot evaluation metrics are unexpectedly poor despite successful checkpoint loading and inference
    does_not_apply_when:
      - Training and evaluation both use raw, unnormalized actions end to end
      - Training and evaluation call the same shared, tested action preprocessing and inverse-preprocessing functions
      - Evaluation is offline-only and never converts predicted normalized actions back to environment actions
    required_checks:
      - Confirm checkpoints or sidecar metadata contain the action statistics or bounds needed by evaluation, including names, tensor shapes, device, dtype, and action dimension order
      - Compare the training action-normalization path with the evaluation load and inverse-normalization path
      - Verify rollout code keeps predictor inputs in the expected normalized action space while denormalizing only before environment execution
      - Run a one-sample parity check that normalizes a recorded training action and then inverse-normalizes it through the evaluation path within a defined tolerance
    evidence:
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/results.md
        claim: >
          Workflow results show the training/evaluation action-stat contract was
          repaired by saving action statistics during training, loading them during
          evaluation, and denormalizing only at environment execution.
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/discussion.md
        claim: >
          Workflow discussion identified action-normalization contract drift as the
          failure mode that motivated the fix.
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/lesson_reviews/20260525T123406Z_verify-train-eval-action-image-processing-parity/human_review.md
        claim: The candidate was independently reviewed and approved before promotion.
    falsification_conditions:
      - A recorded-sample parity test proves that training normalization and evaluation inverse-normalization round-trip actions within the expected tolerance
      - Training and evaluation are refactored to call the same shared, tested action transform contract
      - The workflow uses no action normalization, no action scaling, and no separate environment-execution action conversion
    review_required:
      - codex
      - claude
      - gemini
      - human
    reviews:
      codex: approved
      claude: approved
      gemini: approved
      human: approved
    status: candidate
    created_at: "2026-05-25T20:12:45+08:00"
  - id: validate-checkpoint-provenance-before-full-eval
    title: Validate checkpoint provenance before full evaluation
    confidence: 1
    reason_category: workflow_mechanism_gap
    trigger_event: >
      A workflow run launched a live benchmark against the only available
      corrected checkpoint, but that checkpoint was a one-step smoke-training
      artifact (global_step=1, args.max_steps=1). The follow-up investigation
      confirmed the full evaluation remained unsatisfied because no fully trained
      checkpoint with action_mean and action_std was available locally.
    claim: >
      Before an expensive benchmark or live policy evaluation that consumes an
      explicit checkpoint, the workflow should validate that the exact checkpoint
      path exists, is the artifact the command will actually use, and has
      acceptable provenance for the intended evaluation; otherwise the workflow
      should branch to staging, remediation, or a blocked state instead of
      spending compute on a known-smoke artifact.
    applies_when:
      - A step or downstream command requires an explicit checkpoint, model snapshot, or similar artifact path
      - The workflow is about to run a full benchmark, live environment evaluation, or other expensive closed-loop validation
      - The checkpoint may come from a prior training or retraining step and could be a smoke artifact, partial run, or otherwise insufficient for the benchmark
    does_not_apply_when:
      - The workflow does not consume a checkpoint or other explicit artifact path
      - The evaluation is purely offline and does not depend on a specific persisted model artifact
      - The same command has already validated the exact checkpoint path and provenance in a prior readiness gate in the same workflow run
    required_checks:
      - Confirm the explicit checkpoint path exists and is the exact file passed to the benchmark command
      - Load the checkpoint and record provenance fields chosen for the artifact type and intended evaluation, such as global_step, embedded args, and required action statistics or metadata
      - Reject or block downstream evaluation when the artifact is missing, silently substituted, or clearly only a smoke artifact for a full benchmark
      - If no suitable checkpoint exists, document the blocker and route the workflow to staging or remediation instead of launching the full eval
    evidence:
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/results.md
        claim: >
          Workflow results show the full benchmark and follow-up investigation both
          used the same corrected checkpoint and still failed to reach a non-zero
          success rate.
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/results.md
        claim: >
          Workflow results record that checkpoint inspection exposed smoke-training
          provenance rather than a fully trained model.
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/summary.md
        claim: >
          The workflow summary records that the objective remained failed because no
          fully trained checkpoint was available locally.
      - path: /home/jianshu/workspace/MambaController/workflow_runs/investigate_wm_evaluation/lesson_reviews/20260526T030350Z_validate-checkpoint-provenance-before-full-eval/human_review.md
        claim: The review packet records approval from all three model reviewers and the human.
    falsification_conditions:
      - A future run validates the exact checkpoint path, provenance, and suitability before the expensive benchmark and does not waste compute on a smoke artifact
      - The workflow stages or downloads a fully trained checkpoint through repository-owned automation before launching the benchmark
      - The evaluation flow is refactored so the benchmark cannot run unless a prior gate proves the artifact provenance and training maturity
    review_required:
      - codex
      - claude
      - gemini
      - human
    reviews:
      codex: approved
      claude: approved
      gemini: approved
      human: approved
    status: candidate
    created_at: "2026-05-26T03:05:00+00:00"
  - id: validate-reproduction-config-and-training-budget
    title: Validate reproduction config and training budget before accepting baselines
    confidence: 1
    reason_category: workflow_mechanism_gap
    trigger_terms:
      - reproduction
      - reproduce
      - baseline
      - benchmark
      - paper-scale
      - paper reproduction
      - benchmark reproduction
      - config parity
      - settings parity
      - hyperparameters
      - training budget
      - environment steps
      - max_steps
      - total_iters
      - early stop
      - timeout
    trigger_event: >
      A reviewed workflow lesson candidate showed that a workflow can accept and
      reuse a training/evaluation metric as a reproduction or benchmark-comparable
      baseline even when the acceptance evidence proves only that the run
      completed and produced a final metric. The reusable failure mode is a
      review/planning gap: faithful reproduction claims require original-vs-actual
      settings parity and intended-vs-realized budget evidence, not just a
      plausible metric.
    claim: >
      For reproduction or benchmark-comparable baseline workflows, the workflow
      must validate original-vs-actual configuration parity and
      intended-vs-realized protocol budget before labeling a result as a faithful
      reproduction or comparable baseline. A metric from a run with unproven or
      deviating settings, conflicting schedule controls, an unplanned cap, a
      timeout, an early stop, a failed resume, or a materially shortened realized
      budget should be recorded as an approximate reproduction, ablation, port,
      smoke test, truncated baseline, partial baseline, custom local baseline, or
      inconclusive result unless that changed protocol was explicitly defined as
      the target before running.
    applies_when:
      - A task asks for a paper reproduction, baseline reproduction, benchmark reproduction, paper-scale run, or benchmark-comparable baseline
      - A result will be compared against a paper, published benchmark, external baseline, original implementation, or prior claimed reproduction
      - Training or evaluation has schedule controls such as total iterations, max steps, rollout length, number of environments, evaluation cadence, seeds, early stopping, timeout, or resume behavior
      - Reproduction depends on original settings such as hyperparameters, task/environment version, wrappers, reward terms, preprocessing, seeds, datasets, checkpoints, hardware-relevant knobs, or evaluation protocol
      - CLI arguments, scripts, config files, source-code defaults, logs, checkpoint metadata, or run summaries may disagree about the intended amount of training or evaluation
    does_not_apply_when:
      - The step is explicitly scoped as a smoke test, short-budget diagnostic, API check, or exploratory run and does not claim benchmark comparability
      - The task intentionally defines a new local baseline under a declared custom budget before running and does not claim faithful paper, benchmark, or original-baseline comparability
      - The benchmark protocol is non-iterative and has no meaningful train/eval budget, early-stop, timeout, resume, or configuration-parity dimension
      - Prior verified evidence in the same workflow already records original-vs-actual settings parity, intended budget, realized budget, termination reason, and comparability decision for the exact artifact
    required_checks:
      - Extract the original protocol/configuration from paper text, repository scripts, configs, user direction, source code, or benchmark documentation, including hyperparameters, task/environment version, wrappers, reward terms, preprocessing, seeds, datasets/checkpoints, hardware-relevant knobs, evaluation protocol, and schedule fields such as total iterations, rollout length, number of environments, max steps, eval cadence, and resume or early-stop rules
      - Build an original-vs-actual settings parity table or equivalent structured evidence, marking each important setting as exact match, justified unavoidable substitution, unknown, or deviation
      - Compute derived training/evaluation budget where applicable, such as iterations times rollout length times environment count for vectorized RL schedules, and compare it with caps such as max_steps, timeouts, early stopping, or resume state
      - Inspect logs, metrics CSVs, checkpoint metadata, stdout, scheduler output, or run summaries to record realized environment steps/timesteps, completed iterations or evaluation rows, best and last metrics, and termination reason
      - Treat any unplanned cap, timeout, early stop, failed resume, or realized budget meaningfully below the intended protocol as material unless the workflow records and justifies a domain-specific threshold; when no threshold is available, label the result approximate, truncated, partial, custom-baseline, or inconclusive rather than faithful
      - If settings are unknown/deviating, controls conflict, or the realized run is materially shorter than the apparent protocol, resolve the protocol before acceptance or label the result as approximate/truncated/partial/custom/inconclusive instead of a faithful reproduction
      - Record the settings parity, budget comparison, and comparability decision in acceptance and verification evidence, not only the final metric
    evidence:
      - path: /home/jianshu/workspace/pianomime/workflow_runs/reproduce_results/lesson_candidates.yaml
        claim: >
          Workspace-local lesson candidate records the concrete trigger and the
          generalized required checks for reproduction config and budget parity.
      - path: /home/jianshu/workspace/pianomime/workflow_runs/reproduce_results/lesson_reviews/20260604T105632Z_validate-reproduction-config-and-training-budget/human_review.md
        claim: >
          Review packet records that Codex, Gemini, and Claude approved the
          candidate; the suggested human action allows promotion to confidence 1
          as a low-confidence active advisory after evidence review.
      - path: /home/jianshu/workspace/pianomime/workflow_runs/reproduce_results/results.md
        claim: >
          Source workflow evidence shows a baseline metric was accepted and reused
          for comparison using completion/metric evidence without a prior
          original-vs-actual settings parity and budget-comparability gate.
    falsification_conditions:
      - The task is explicitly a local custom-baseline, smoke, diagnostic, or exploratory run and does not claim faithful reproduction or benchmark comparability
      - The workflow records original-vs-actual settings parity, intended budget, realized budget, termination reason, and comparability decision before accepting the reproduction or comparable baseline
      - A canonical benchmark harness or repository-owned gate enforces config parity and fails on unknown/deviating settings, conflicting schedule controls, unplanned caps, timeouts, early stops, or failed resumes before metrics can be labeled faithful or comparable
      - Budget controls are refactored so one source of truth derives the rest or fails on disagreement; this only satisfies the budget-control portion for that code path, and configuration parity is still required when comparability is claimed
    review_required:
      - codex
      - claude
      - gemini
      - human
    reviews:
      codex: approved
      claude: approved
      gemini: approved
      human: approved
    status: candidate
    created_at: "2026-06-04T00:00:00+00:00"
